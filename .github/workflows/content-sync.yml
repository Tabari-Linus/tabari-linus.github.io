name: Sync content from Issues

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened, deleted]
  workflow_dispatch:

permissions:
  contents: write # commit regenerated content files
  issues: read
  actions: write # dispatch the deploy workflow

concurrency:
  group: content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Only react to your own issues with a content label
    # (or a manual run). Third-party issues never trigger a publish.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == 'Tabari-Linus' &&
       (contains(github.event.issue.labels.*.name, 'blog') ||
        contains(github.event.issue.labels.*.name, 'project') ||
        github.event.action == 'unlabeled' ||
        github.event.action == 'deleted'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate content from issues
        run: node scripts/fetch-content.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes (if any)
        run: |
          git config user.name "content-sync[bot]"
          git config user.email "actions@github.com"
          git add src/content
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "content: sync from issues"
            git push
          fi
        # Note: pushes made with GITHUB_TOKEN do NOT trigger other
        # workflows, so we explicitly dispatch the deploy below.

      - name: Trigger deploy
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
